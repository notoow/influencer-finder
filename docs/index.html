  <link rel="stylesheet" href="styles.css" />
  <meta name="description" content="팔로워 8천~1만5천 신혼부부 인스타 후보를 필터링하고 결과를 바로 추출하는 보드형 대시보드" />

    </header>

    <main class="workspace">
      <section class="panel card controls" data-tab="filters">
        <div class="panel-title-row">
          <h2>탐색 기준</h2>

            <select id="presetSelect"></select>
          </label>
          <label class="field">
            <span>추가 키워드</span>

          </label>
          <label class="field">

            <input id="minFollowers" type="number" />
          </label>
          <label class="field">
            <span>팔로워 최대</span>
            <input id="maxFollowers" type="number" />
          </label>
          <label class="field">
            <span>정렬</span>
            <select id="sortSelect">
              <option value="followers_desc">팔로워 많은 순</option>
              <option value="followers_asc">팔로워 적은 순</option>
              <option value="score_desc">스코어 높은 순</option>
              <option value="engagement_desc">참여율 높은 순</option>
              <option value="name_asc">이름 오름차순</option>
            </select>
          </label>
          <label class="field">
            <span>뷰 모드</span>
            <div class="view-mode" role="group" aria-label="보드 뷰">
              <button type="button" data-view="profile">프로필</button>
              <button type="button" class="active" data-view="feed">피드</button>
              <button type="button" data-view="list">리스트</button>
            </div>
          </label>
          <label class="field checkbox">
            <input id="includePrivate" type="checkbox" />
            <span>비공개 계정 포함</span>
          </label>
        </div>

        <div class="action-row">
          <button id="applyBtn" class="primary">적용</button>
          <button id="resetBtn" type="button">초기화</button>
          <button id="exportBtn" type="button">CSV 다운로드</button>
        </div>
      </section>

      <section class="panel card source" data-tab="data">
        <div class="panel-title-row">
          <h2>데이터 가져오기</h2>
          <p>CSV를 붙여넣거나 공개 URL로 즉시 반영합니다.</p>
        </div>

        <div class="source-grid">
          <label class="field">
            <span>CSV 파일</span>
            <input id="csvFile" type="file" accept=".csv" />
          </label>

    function parseCsvRows(text) {
      const rows = [];
      let row = [];
      let value = '';
      let isInQuotes = false;

      const pushValue = () => {
        row.push(value.trim());
        value = '';
      };

      const pushRow = () => {
        if (row.length && row.some((x) => x !== '')) {
          rows.push(row);
        }
        row = [];
      };

      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];
        const next = text[i + 1];

        if (isInQuotes) {
          if (ch === '"') {
            if (next === '"') {
              value += '"';
              i += 1;
            } else {
              isInQuotes = false;
            }
          } else {
            value += ch;
          }
          continue;
        }

        if (ch === '"') {
          isInQuotes = true;
        } else if (ch === ',') {
          pushValue();
        } else if (ch === '\n') {
          pushValue();
          pushRow();
        } else if (ch === '\r') {
          continue;
        } else {
          value += ch;
        }
      }

      pushValue();
      if (row.length && row.some((x) => x !== '')) rows.push(row);
      return rows;
    }

    function rowsToObjects(text) {
      const rows = parseCsvRows(text);
      if (!rows.length) return [];
      const header = rows[0].map((x) => x.trim().toLowerCase());
      return rows.slice(1).map((r) => {
        const obj = {};
        header.forEach((h, idx) => {
          obj[h] = (r[idx] || '').trim();
        });
        return obj;
      });
    }

    function normalizeKeywords(raw) {
      return raw
        .split(',')
        .map((x) => x.trim().toLowerCase())
        .filter(Boolean);
    }

    function matchesKeywordText(profile, terms) {
      const target = `${profile.name} ${profile.handle} ${profile.bio || ''} ${(profile.tags || []).join(' ')}`.toLowerCase();
      return terms.some((t) => target.includes(t));
    }

    function getFilteredData() {
      const preset = PRESETS[els.presetSelect.value] || PRESETS.custom;
      const inputTerms = normalizeKeywords(els.keywordInput.value);
      const queryTerms = [...preset.words.map((x) => x.toLowerCase()), ...inputTerms];
      const minFollowers = Number(els.minFollowers.value);
      const maxFollowers = Number(els.maxFollowers.value);
      const includePrivate = els.includePrivate.checked;

      let list = currentData.filter((p) => {
        if (!includePrivate && p.private) return false;
        if (Number.isFinite(minFollowers) && p.followers < minFollowers) return false;
        if (Number.isFinite(maxFollowers) && p.followers > maxFollowers) return false;
        if (!queryTerms.length) return true;
        if (matchesKeywordText(p, queryTerms)) return true;
        return (p.tags || []).some((t) => queryTerms.includes(t.toLowerCase()));
      });

      const sorter = els.sortSelect.value;
      if (sorter === 'followers_desc') {
        list.sort((a, b) => b.followers - a.followers);
      } else if (sorter === 'followers_asc') {
        list.sort((a, b) => a.followers - b.followers);
      } else if (sorter === 'score_desc') {
        list.sort((a, b) => b.score - a.score);
      } else if (sorter === 'engagement_desc') {
        list.sort((a, b) => b.engagement - a.engagement);
      } else if (sorter === 'name_asc') {
        list.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
      }

      return list;
    }

    function renderProfileCards(list) {
      if (!list.length) {
        return '<p class="empty">조건에 맞는 후보가 없습니다.</p>';
      }
      return list
        .map(
          (p) => `
          <article class="profile-card">
            <div class="profile-top">
              <img class="avatar" src="${p.avatar}" alt="${p.name}" />
              <div>
                <h3>${p.name}</h3>
                <p>${p.handle}</p>
                <span class="pill ${p.private ? 'negative' : 'positive'}">${p.private ? '비공개' : '공개'}</span>
              </div>
            </div>
            <p class="bio">${p.bio}</p>
            <div class="tagline">${(p.tags || []).map((t) => `<span>${t}</span>`).join('')}</div>
            <div class="metrics">
              <div><strong>${formatNum(p.followers)}</strong><small>팔로워</small></div>
              <div><strong>${formatRate(p.engagement)}</strong><small>참여율</small></div>
              <div><strong>${p.score}</strong><small>스코어</small></div>
            </div>
            <a class="link-btn" href="${p.profileUrl}" target="_blank" rel="noreferrer">프로필 열기</a>
          </article>
        `
        )
        .join('');
    }

      const tiles = [];
      list.forEach((p) => {
        (p.feed || []).slice(0, 2).forEach((f) => {
          tiles.push({ user: p, post: f });
        });
      });

      if (!tiles.length) {
        return '<p class="empty">포스트 데이터가 없어 피드를 렌더링할 수 없습니다.</p>';
      }

      return tiles
        .map(
          ({ user, post }) => `
            <article class="feed-card">
              <div class="feed-head">
                <img src="${user.avatar}" alt="${user.name}" />
                <div>
                  <strong>${user.name}</strong>
                  <span>${user.handle}</span>
                </div>
              </div>
              <img class="feed-img" src="${post.image}" alt="feed" />
              <p class="feed-caption">${post.caption}</p>
              <p class="feed-meta">좋아요 ${post.likes.toLocaleString('ko-KR')} · 댓글 ${post.comments.toLocaleString('ko-KR')}</p>
            </article>
          `
        )
        .join('');
    }

    function renderList(list) {
      if (!list.length) {
        return '<p class="empty">조건에 맞는 후보가 없습니다.</p>';
      }
      return `
        <div class="table-wrap">
          <table class="list-table">
            <thead>
              <tr>
                <th>프로필</th>
                <th>팔로워</th>
                <th>참여율</th>
                <th>태그</th>
                <th>스코어</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              ${list
                .map(
                  (p) => `
                    <tr>
                      <td><a href="${p.profileUrl}" target="_blank" rel="noreferrer">${p.name} (${p.handle})</a></td>
                      <td>${formatNum(p.followers)}</td>
                      <td>${formatRate(p.engagement)}</td>
                      <td>${(p.tags || []).join(', ')}</td>
                      <td>${p.score}</td>
                      <td>${p.private ? '비공개' : '공개'}</td>
                    </tr>
                  `
                )
                .join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function render() {
      const list = getFilteredData();
      const avgFollowers = list.length ? list.reduce((acc, cur) => acc + cur.followers, 0) / list.length : 0;
      const avgEngagement = list.length ? list.reduce((acc, cur) => acc + cur.engagement, 0) / list.length : 0;
      const avgScore = list.length ? list.reduce((acc, cur) => acc + cur.score, 0) / list.length : 0;

      els.resultSummary.textContent = `총 ${list.length}개 후보`;
      els.resultStats.innerHTML = `
        <span>평균 팔로워 ${formatNum(Math.round(avgFollowers))}</span>
        <span>평균 참여율 ${formatRate(avgEngagement)}</span>
        <span>평균 스코어 ${avgScore.toFixed(1)}</span>
      `;
      if (list.length) {
        els.resultHint.textContent = '필터 조건을 기준으로 정렬·요약한 실사용용 후보 리스트입니다.';
      } else {
        els.resultHint.textContent = '조건에 맞는 후보가 없습니다. 키워드/팔로워 범위를 넓혀보세요.';
      }

      if (currentView === 'profile') {
        els.resultContainer.className = 'result-content profile';
        els.resultContainer.innerHTML = renderProfileCards(list);
      } else if (currentView === 'list') {
        els.resultContainer.className = 'result-content list';
        els.resultContainer.innerHTML = renderList(list);
      } else {
        els.resultContainer.className = 'result-content feed';
        els.resultContainer.innerHTML = renderFeed(list);
      }
    }

    function csvToProfiles(rows) {
      return rows
        .map((r) => {
          const handle = r.username || r.handle || r.id || '';
          const followers = Number((r.followers || r.follower_count || r.follow_count || '0').replace(/,/g, '')) || 0;
          const engagement = Number(r.engagement_rate || r.engagement || 0);
          const score = Number(r.keyword_hit || r.score || 0);
          const tags = r.tags
            ? r.tags
                .split(',')
                .map((x) => x.trim())
                .filter(Boolean)
            : [r.keyword_hit || '신혼부부'];

          return {
            id: handle || Math.random().toString(36).slice(2),
            name: r.full_name || handle || 'Unknown',
            handle,
            followers,
            private: String(r.is_private).toLowerCase() === 'true',
            engagement,
            score: score || 0,
            bio: r.bio || '',
            tags,
            profileUrl: r.profile_url || `https://www.instagram.com/${handle.replace(/^@/, '')}`,
            avatar: r.avatar_url || `https://i.pravatar.cc/240?u=${encodeURIComponent(handle)}`,
            feed: [],
          };
        })
        .filter((x) => x.handle);
    }

    function updatePresetInputs() {
      const preset = PRESETS[els.presetSelect.value] || PRESETS.custom;
      if (!els.keywordInput.value.trim()) els.keywordInput.value = preset.words.join(', ');
      if (!els.minFollowers.value) els.minFollowers.value = preset.minFollowers;
      if (!els.maxFollowers.value) els.maxFollowers.value = preset.maxFollowers;
      render();
    }

    function downloadCSV() {
      const data = getFilteredData();
      if (!data.length) {
        alert('내보낼 데이터가 없습니다.');
        return;
      }

      const headers = ['username', 'followers', 'engagement_rate', 'keyword_hit', 'is_private', 'bio', 'tags', 'profile_url'];
      const rows = data.map((p) => [
        p.handle,
        p.followers,
        p.engagement,
        p.score,
        p.private ? 'TRUE' : 'FALSE',
        `"${String(p.bio).replaceAll('"', '""')}"`,
        `"${(p.tags || []).join('|').replaceAll('"', '""')}"`,
        p.profileUrl,
      ]);
      const csv = [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'filtered_influencers.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    async function loadCsvFromFile(file) {
      const text = await file.text();
      const rows = rowsToObjects(text);
      const profiles = csvToProfiles(rows);
      if (!profiles.length) {
        alert('CSV 파싱 결과가 없습니다.');
        return;
      }
      currentData = profiles;
      els.resultHint.textContent = `총 ${currentData.length}개 데이터로 덮어씀`; 
      render();
      applyTab('board');
    }

    async function loadCsvFromUrl() {
      const url = els.csvUrl.value.trim();
      if (!url) {
        alert('URL을 입력해주세요.');
        return;
      }

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error('응답 오류');
        }
        const text = await response.text();
        const rows = rowsToObjects(text);
        const profiles = csvToProfiles(rows);
        if (!profiles.length) {
          alert('CSV 파싱 실패 혹은 지원되지 않는 헤더 형식입니다.');
          return;
        }
        currentData = profiles;
        els.resultHint.textContent = `총 ${currentData.length}개 데이터로 덮어씀`;
        render();
        applyTab('board');
      } catch (err) {
        alert('URL에서 CSV를 불러오지 못했습니다. 접근 권한/CORS/URL을 확인해 주세요.');
      }
    }

    function resetFilters() {
      els.presetSelect.value = 'newlywed';
      updatePresetInputs();
      els.keywordInput.value = PRESETS.newlywed.words.join(', ');
      els.minFollowers.value = PRESETS.newlywed.minFollowers;
      els.maxFollowers.value = PRESETS.newlywed.maxFollowers;
      els.includePrivate.checked = false;
      els.sortSelect.value = 'followers_desc';
      render();
      applyTab('filters');
    }

    function setViewMode(mode) {
      currentView = mode;
      document.querySelectorAll('.view-mode button').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.view === mode);
      });
      render();
    }

    tabButtons.forEach((btn) => {
      btn.addEventListener('click', () => applyTab(btn.dataset.tab));
    });

    viewModeButtons.forEach((btn) => {
      btn.addEventListener('click', () => setViewMode(btn.dataset.view));
    });

    els.applyBtn.addEventListener('click', render);
    els.resetBtn.addEventListener('click', resetFilters);
    els.exportBtn.addEventListener('click', downloadCSV);
    els.presetSelect.addEventListener('change', updatePresetInputs);
    els.loadUrlBtn.addEventListener('click', loadCsvFromUrl);
    els.csvFile.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) loadCsvFromFile(file);
    });

    applyPresetOptions();
    applyTab('filters');
    render();
  </script>
</body>
</html>
